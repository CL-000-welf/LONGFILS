    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

    <style>
        :root { --main-color: #333; --bg-color: #ffffff; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--main-color); }
        
        /* Layout centrale stile index-old */
        .wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .logo-container svg {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 2rem;
        }

        /* Menu Hamburger Desktop & Mobile */
        .hamburger-menu {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 1050;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--main-color);
        }

        /* Overlay Fullscreen Menu */
        .nav-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.98);
            z-index: 1040;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .nav-overlay.active { display: flex; }
        .nav-list { list-style: none; padding: 0; text-align: center; }
        .nav-list li { margin: 20px 0; }
        .nav-list a { 
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            text-decoration: none;
            color: var(--main-color);
            transition: 0.3s;
        }
        .nav-list a:hover { opacity: 0.5; }
        
        /* Sottovoci Menu */
        .submenu { list-style: none; padding: 0; margin-top: 10px; }
        .submenu a { font-size: 1.1rem !important; font-family: 'Inter', sans-serif !important; text-transform: uppercase; letter-spacing: 1px; }

        /* Bottoni Evento Sabato */
        .event-box { margin-top: 30px; }
        .btn-custom {
            border: 1px solid var(--main-color);
            background: transparent;
            color: var(--main-color);
            border-radius: 0;
            padding: 12px 25px;
            margin: 10px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.4s;
        }
        .btn-custom:hover { background: var(--main-color); color: #fff; }

        @media (max-width: 768px) {
            .logo-container svg { max-width: 280px; }
            .nav-list a { font-size: 1.5rem; }
        }
    </style>
</head>
