    <style>
        :root {
            --primary-color: #333333;
            --transition: all 0.4s ease-in-out;
        }

        /* Reset altezza per distribuzione spaziale */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: var(--primary-color);
        }

        /* --- MENU HAMBURGER --- */
        .hamburger-btn {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 2000;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
        }
        .hamburger-btn .line {
            width: 25px;
            height: 1px;
            background-color: var(--primary-color);
            display: block;
            margin: 7px 0;
            transition: var(--transition);
        }
        .hamburger-btn.active .line:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger-btn.active .line:nth-child(2) { opacity: 0; }
        .hamburger-btn.active .line:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* --- NAV OVERLAY --- */
        .nav-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        .nav-overlay.open { opacity: 1; visibility: visible; }
        .nav-list { list-style: none; padding: 0; text-align: center; }
        .nav-list a {
            font-size: 1.1rem;
            font-weight: 300;
            text-decoration: none;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 5px;
            display: inline-block;
            padding: 15px;
            transition: var(--transition);
        }

        /* --- STRUTTURA VERTICALE --- */
        .site-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1; /* Occupa tutto lo spazio tra header e footer */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Distribuzione equilibrata */
            padding: 60px 20px 40px 20px;
        }

        /* Logo: rimosso spazio bianco interno grazie al nuovo SVG */
        .logo-box { 
            width: 100%;
            max-width: 500px; /* Logo più visibile */
            margin-bottom: 20px;
        }
        .logo-box svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Contenitore Immagine Centrale */
        .hero-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 30px 0;
        }
        .hero-img {
            max-width: 100%;
            max-height: 45vh; /* Proporzione ideale per non affollare */
            height: auto;
            width: auto;
            object-fit: contain;
            box-shadow: 0 15px 45px rgba(0,0,0,0.03);
        }

        /* Blocco Testi e Bottoni in basso */
        .bottom-actions {
            width: 100%;
            text-align: center;
        }

        .btn-group-custom { 
            display: flex; 
            gap: 20px; 
            justify-content: center;
            margin-bottom: 25px; 
        }
        .btn-dl {
            border: 1px solid var(--primary-color);
            padding: 12px 35px;
            font-size: 0.7rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            color: var(--primary-color);
            transition: var(--transition);
        }
        .btn-dl:hover { background: var(--primary-color); color: #fff; }

        .info-event {
            font-weight: 300;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.8;
            margin-bottom: 10px;
        }

        /* --- FOOTER --- */
        footer {
            padding: 30px 20px;
            border-top: 1px solid #f2f2f2;
            text-align: center;
        }
        .footer-social a { color: var(--primary-color); margin: 0 12px; font-size: 1.1rem; }
        .copy { margin-top: 15px; opacity: 0.4; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hamburger-btn { top: 25px; right: 25px; }
            .logo-box { max-width: 300px; }
            .hero-img { max-height: 35vh; }
            .btn-group-custom { flex-direction: column; align-items: center; gap: 10px; }
            .btn-dl { width: 100%; max-width: 260px; }
        }
    </style>
</head>

    <script>
        const btn = document.getElementById('toggleMenu');
        const overlay = document.getElementById('menuOverlay');
        const navLinks = document.querySelectorAll('.nav-list a');

        btn.addEventListener('click', () => {
            btn.classList.toggle('active');
            overlay.classList.toggle('open');
            document.body.style.overflow = overlay.classList.contains('open') ? 'hidden' : 'auto';
        });

        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                btn.classList.remove('active');
                overlay.classList.remove('open');
                document.body.style.overflow = 'auto';
            });
        });
    </script>
