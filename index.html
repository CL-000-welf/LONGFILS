    <style>
        /* BLOCCO STILI GENERALI */
        :root {
            --primary-color: #333333;
            --transition: all 0.4s ease-in-out;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
        }

        /* BLOCCO MENU HAMBURGER (Sempre visibile) */
        .hamburger-btn {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 2000;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
        }
        .hamburger-btn .line {
            width: 25px;
            height: 1px;
            background-color: var(--primary-color);
            display: block;
            margin: 7px 0;
            transition: var(--transition);
        }
        /* Animazione X */
        .hamburger-btn.active .line:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger-btn.active .line:nth-child(2) { opacity: 0; }
        .hamburger-btn.active .line:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* BLOCCO OVERLAY NAVIGAZIONE */
        .nav-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        .nav-overlay.open { opacity: 1; visibility: visible; }
        .nav-list { list-style: none; padding: 0; text-align: center; }
        .nav-list a {
            font-size: 1.2rem;
            font-weight: 300;
            text-decoration: none;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 5px;
            display: inline-block;
            padding: 15px;
            transition: var(--transition);
        }
        .nav-list a:hover { opacity: 0.4; letter-spacing: 8px; }

        /* BLOCCO CONTENUTO PRINCIPALE (Stile Minimalista) */
        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 60px 20px;
            text-align: center;
        }

        .logo-box { max-width: 400px; width: 85%; margin-bottom: 2rem; }
        
        /* Immagine Opera Sotto Logo */
        .hero-img {
            max-width: 500px; /* Dimensione contenuta per eleganza */
            width: 100%;
            height: auto;
            margin-bottom: 2.5rem;
            animation: fadeIn 2s ease;
        }

        /* BLOCCO PULSANTI (Cartella Assets) */
        .btn-group-custom { display: flex; gap: 15px; margin-bottom: 2rem; }
        .btn-dl {
            border: 1px solid var(--primary-color);
            padding: 12px 28px;
            font-size: 0.7rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            color: var(--primary-color);
            transition: var(--transition);
        }
        .btn-dl:hover { background: var(--primary-color); color: #fff; }

        /* BLOCCO FOOTER */
        footer {
            flex-shrink: 0;
            padding: 40px 20px;
            border-top: 1px solid #f2f2f2;
            font-weight: 300;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-align: center;
        }
        .footer-social a { color: var(--primary-color); margin: 0 10px; font-size: 1rem; }
        .copy { margin-top: 15px; opacity: 0.5; font-size: 0.6rem; text-transform: uppercase; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .logo-box { max-width: 280px; }
            .btn-group-custom { flex-direction: column; width: 100%; max-width: 250px; }
            .hamburger-btn { top: 25px; right: 25px; }
        }
    </style>
</head>

    <script>
        const btn = document.getElementById('toggleMenu');
        const overlay = document.getElementById('menuOverlay');
        const navLinks = document.querySelectorAll('.nav-list a');

        btn.addEventListener('click', () => {
            btn.classList.toggle('active');
            overlay.classList.toggle('open');
            document.body.style.overflow = overlay.classList.contains('open') ? 'hidden' : 'auto';
        });

        // Chiude il menu quando si clicca un link
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                btn.classList.remove('active');
                overlay.classList.remove('open');
                document.body.style.overflow = 'auto';
            });
        });
    </script>
