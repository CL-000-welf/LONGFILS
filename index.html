<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davide Longfils | Frequenze</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container">
            <h1 class="artist-name">DAVIDE <br> <span>LONGFILS</span></h1>
        </div>
    </header>

    <main class="container">
        <section class="hero-image">
            <img src="assets/opera-frequenze.jpg" alt="Opera Frequenze di Davide Longfils">
        </section>

        <section class="event-info">
            <h2 class="exhibition-title">FREQUENZE</h2>
            <p class="curators">a cura di Roberto Pagnani <br> testo di Roberto Borghi</p>
            
            <div class="date-box">
                <p class="dates">DAL 14 AL 26 MARZO 2026</p>
                <p class="inauguration">Inaugurazione: ore 18:30</p>
            </div>

            <p class="location">Viale Giorgio Pallavicini 22 - Ravenna</p>
        </section>

        <section class="actions">
            <a href="assets/locandina.pdf" class="btn" download>SCARICA LA LOCANDINA</a>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Promosso e organizzato da: PALLAVICINI22 Art Gallery</p>
            <p>&copy; 2026 Davide Longfils</p>
        </div>
    </footer>

</body>
</html>
