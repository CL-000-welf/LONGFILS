<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davide Longfils | Home</title>
    
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <meta property="og:image" content="assets/favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #333333;
            --transition: all 0.4s ease-in-out;
        }

        html, body {
            height: 100%;
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: var(--primary-color);
            overflow-x: hidden;
        }

        /* --- MENU HAMBURGER --- */
        .hamburger-btn {
            position: fixed; top: 40px; right: 40px; z-index: 2000;
            background: none; border: none; cursor: pointer; padding: 10px;
        }
        .hamburger-btn .line {
            width: 25px; height: 1px;
            background-color: var(--primary-color);
            display: block; margin: 7px 0;
            transition: var(--transition);
        }
        .hamburger-btn.active .line:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger-btn.active .line:nth-child(2) { opacity: 0; }
        .hamburger-btn.active .line:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        .nav-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1500; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: var(--transition);
        }
        .nav-overlay.open { opacity: 1; visibility: visible; }
        .nav-list { list-style: none; padding: 0; text-align: center; }
        .nav-list a {
            font-size: 1.1rem; font-weight: 300; text-decoration: none;
            color: var(--primary-color); text-transform: uppercase;
            letter-spacing: 5px; display: inline-block; padding: 15px;
        }

        /* --- STRUTTURA --- */
        .site-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px 20px;
        }

        /* Logo PNG (come in Fotografia) */
        .logo-box { width: 100%; max-width: 400px; margin-bottom: 40px; text-align: center; }
        .main-logo { width: 100%; height: auto; display: block; }
        
        /* Contenitore Immagine Centrale */
        .hero-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px 0;
            animation: fadeIn 1.5s ease;
        }
        .hero-img {
            max-width: 100%;
            max-height: 50vh;
            height: auto;
            width: auto;
            object-fit: contain;
        }

        /* Bottoni e Testi */
        .bottom-actions {
            width: 100%;
            text-align: center;
            margin-top: 20px;
        }

        .btn-group-custom { 
            display: flex; 
            gap: 20px; 
            justify-content: center;
            margin-bottom: 25px; 
        }
        .btn-dl {
            border: 1px solid var(--primary-color);
            padding: 12px 35px;
            font-size: 0.7rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            color: var(--primary-color);
            transition: var(--transition);
        }
        .btn-dl:hover { background: var(--primary-color); color: #fff; }

        .info-event {
            font-weight: 300;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.8;
        }

        /* --- FOOTER (Identico a Fotografia) --- */
        footer { padding: 40px 20px; border-top: 1px solid #f2f2f2; text-align: center; }
        .footer-social a { color: var(--primary-color); margin: 0 12px; font-size: 1.1rem; text-decoration: none; }
        .symbol-icon { height: 0.85rem; width: auto; display: inherit; margin-top: -4px; }
        .footer-social a:hover { opacity: 0.6; }

        .copy { margin-top: 15px; opacity: 0.4; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; }
        .copy a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; }
        .copy a:hover { border-bottom: 1px solid #333; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .logo-box { max-width: 250px; }
            .hero-img { max-height: 40vh; }
            .hamburger-btn { top: 25px; right: 25px; }
            .btn-group-custom { flex-direction: column; align-items: center; gap: 10px; }
            .btn-dl { width: 100%; max-width: 260px; }
        }
    </style>
</head>
<body>

    <div class="site-container">
        <button class="hamburger-btn" id="toggleMenu">
            <span class="line"></span><span class="line"></span><span class="line"></span>
        </button>

        <nav class="nav-overlay" id="menuOverlay">
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="biografia.html">Biografia</a></li>
                <li><a href="testo-critico.html">Testo Critico</a></li>
                <li><a href="fotografia.html">Fotografia</a></li>
                <li><a href="opere.html">Opere</a></li>
                <li><a href="mostre.html">Mostre</a></li>
            </ul>
        </nav>

        <main>
            <div class="logo-box">
                <a href="index.html">
                    <img src="assets/logo-davide-longfils.png" alt="Davide Longfils" class="main-logo">
                </a>
            </div>

            <div class="hero-container">
                <img src="assets/opera-frequenze.jpg" alt="Frequenze - Davide Longfils" class="hero-img">
            </div>

            <div class="bottom-actions">
                <div class="btn-group-custom">
                    <a href="assets/locandina.pdf" target="_blank" class="btn-dl">Locandina</a>
                    <a href="assets/catalogo.pdf" target="_blank" class="btn-dl">Catalogo</a>
                </div>
                <div class="info-event">
                    <p><strong>Frequenze</strong> — 14 / 28 Marzo 2026<br>
                    <span style="font-weight: 200; font-size: 0.7rem;">Casa Pallavicini 22, Ravenna</span></p>
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-social">
                <a href="/">
                    <img src="assets/simbolo-grafico-nero.png" alt="Home" class="symbol-icon">
                </a>
                
                <a href="mailto:davide.longfils@gmail.com">
                    <i class="far fa-envelope"></i>
                </a>
            </div>
            <p class="mb-0" style="text-transform: uppercase; letter-spacing: 2px; font-weight: 400;">Davide Longfils</p>
            <p class="copy">© 2026 Tutti i diritti riservati - Partner web: <a href="https://grafichello.it" target="_blank">grafichello.it</a></p>
        </footer>
    </div>

    <script>
        const btn = document.getElementById('toggleMenu');
        const overlay = document.getElementById('menuOverlay');

        btn.onclick = () => {
            btn.classList.toggle('active');
            overlay.classList.toggle('open');
            document.body.style.overflow = overlay.classList.contains('open') ? 'hidden' : 'auto';
        };

        document.querySelectorAll('.nav-list a').forEach(l => {
            l.onclick = () => {
                btn.classList.remove('active');
                overlay.classList.remove('open');
                document.body.style.overflow = 'auto';
            };
        });
    </script>
</body>
</html>
